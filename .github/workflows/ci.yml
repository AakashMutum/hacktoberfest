name: CI

on:
  push:
    branches: [main, polish]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx eslint src --max-warnings=0
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t circuit-breaker .
      - name: Start container and check health
        run: |
          docker run -d --name cb -p 127.0.0.1:8000:8000 circuit-breaker
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/api/health > /dev/null; then echo "healthy"; exit 0; fi
            sleep 2
          done
          docker logs cb
          exit 1
